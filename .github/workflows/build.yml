name: Build Release Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Build Windows C++
        shell: cmd
        run: |
          mkdir dist
          rc /nologo /fo windows\app.res windows\app.rc
          cl /nologo /std:c++17 /O1 /Os /MT /utf-8 /EHsc /GS /guard:cf /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 ^
            windows\cpp\*.cpp windows\app.res /Fe:dist\batt-tray-win-cpp.exe ^
            user32.lib gdi32.lib shell32.lib advapi32.lib setupapi.lib hid.lib d2d1.lib dwrite.lib windowscodecs.lib ole32.lib ^
            /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF /OPT:REF /OPT:ICF /MANIFEST:NO

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmd /c cl 2>&1 | Select-Object -First 1
          rustc --version
          cargo --version

      - name: Run Windows C++ tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /MT /utf-8 /EHsc /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /I windows\cpp ^
            tests\win_cpp_tests.cpp windows\cpp\device.cpp /Fe:%TEMP%\win_cpp_tests.exe /Fo:%TEMP%\
          %TEMP%\win_cpp_tests.exe

      - name: Build Windows Rust
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C control-flow-guard=yes"
          cargo test --manifest-path windows\rust\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path windows\rust\Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows\rust\target\release\batt-tray-win.exe dist\batt-tray-win-rust.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          path: dist\batt-tray-win-*.exe

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install libdbus-1
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build Linux C++
        run: |
          mkdir -p dist
          g++ -std=c++17 -Os -fno-exceptions -fno-rtti -flto -ffunction-sections -fdata-sections \
            -fPIE -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror \
            linux/cpp/*.cpp -o dist/batt-tray-linux-cpp $(pkg-config --cflags --libs dbus-1) \
            -pie -Wl,--gc-sections,-z,relro,-z,now -s

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Toolchain versions
        run: |
          g++ --version | head -n 1
          pkg-config --modversion dbus-1
          rustc --version
          cargo --version

      - name: Run Linux C++ tests
        run: |
          g++ -std=c++17 -Os -fno-exceptions -fno-rtti -Wall -Wextra -Werror \
            -I linux/cpp tests/linux_cpp_tests.cpp linux/cpp/device.cpp -o /tmp/linux_cpp_tests
          /tmp/linux_cpp_tests

      - name: Build Linux Rust
        run: |
          cargo test --manifest-path linux/rust/Cargo.toml
          RUSTFLAGS="-C relocation-model=pie -C link-arg=-Wl,-z,relro,-z,now" \
          cargo build --manifest-path linux/rust/Cargo.toml --release
          cp linux/rust/target/release/batt-tray-linux dist/batt-tray-linux-rust

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-binaries
          path: dist/batt-tray-linux-*

  release:
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum batt-tray-* > SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'release-assets/batt-tray-*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
