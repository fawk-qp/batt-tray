name: Build Windows EXE (C++ & Rust)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC for C++
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ EXE
        shell: cmd
        run: |
          mkdir dist
          cl /nologo /std:c++17 /O2 /MT /utf-8 /EHsc /DUNICODE /D_UNICODE cpp\main.cpp /Fe:dist\TrayBattery-cpp.exe /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust EXE
        shell: pwsh
        run: |
          cargo build --manifest-path rust\Cargo.toml --release
          Copy-Item rust\target\release\tray-battery-rust.exe dist\TrayBattery-rust.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrayBattery-Windows-x64
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: TrayBattery-Windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrayBattery-cpp.exe
            dist/TrayBattery-rust.exe